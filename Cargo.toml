[package]
name = "trueos-picasso"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
# Host ingestion is deliberately opt-in at the package boundary.  Bare-metal
# consumers get only `core`, with no parser, filesystem, or database backend.
default = ["host"]
blueprint = ["dep:trueos_bp", "runtime-assets"]
host = ["dep:base64", "dep:gltf", "dep:log_os_core", "dep:serde", "dep:serde_json", "redb/std", "runtime-assets"]
runtime-assets = ["dep:redb"]
test-std = ["redb/std"]

[dependencies]
base64 = { version = "0.22", optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"], optional = true }
libm = "0.2"
log_os_core = { package = "log-os", path = "../TRUEOS-Blueprints/crates/log-os", default-features = false, optional = true }
redb = { version = "4.2.0", default-features = false, features = ["experimental-api-5"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
trueos_bp = { package = "trueos", path = "../TRUEOS-Blueprints/api", optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
